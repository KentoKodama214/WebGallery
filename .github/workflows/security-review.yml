name: セキュリティレビュー

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  security-review:
    name: Claude Codeによるセキュリティレビュー
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: セキュリティレビュー実行
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
