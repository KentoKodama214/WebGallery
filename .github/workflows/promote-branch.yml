name: 環境昇格PR自動作成

on:
  push:
    branches:
      - development
      - staging

jobs:
  create-promotion-pr:
    name: 昇格PR作成
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: マージ先ブランチを決定
        id: target
        run: |
          case "${{ github.ref_name }}" in
            development) echo "base=staging" >> "$GITHUB_OUTPUT" ;;
            staging) echo "base=master" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # staging→masterの昇格（＝本番リリース）のタイミングでのみリリースタグを発行する。
      # セマンティックバージョニング（vX.Y.Z）のpatchを自動インクリメントし、
      # minor/majorの更新は運用者が別途手動でタグを打つ想定。
      - name: リリースタグを生成
        if: github.ref_name == 'staging'
        id: tag
        run: |
          git fetch --tags
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            new_tag="v1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: 既存のオープンPRを確認
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "${{ steps.target.outputs.base }}" \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number -q '.[0].number')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      - name: 昇格PR本文を決定
        id: body
        run: |
          body="${{ github.ref_name }} への変更を ${{ steps.target.outputs.base }} へ反映するための自動生成PRです。"
          if [ -n "${{ steps.tag.outputs.tag }}" ]; then
            body="${body}"$'\n\n'"リリースタグ: ${{ steps.tag.outputs.tag }}"
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 昇格PRを作成
        if: steps.check.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ steps.target.outputs.base }}" \
            --head "${{ github.ref_name }}" \
            --title "chore: ${{ github.ref_name }} を ${{ steps.target.outputs.base }} へ反映" \
            --body "${{ steps.body.outputs.body }}"

      - name: スキップ理由を出力
        if: steps.check.outputs.existing != ''
        run: echo "既存のオープンPR #${{ steps.check.outputs.existing }} があるためスキップしました"
