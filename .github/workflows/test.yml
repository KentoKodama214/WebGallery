name: テスト実行

on:
  pull_request:
    branches:
      - main

jobs:
  frontend-unit-test:
    name: フロントエンド単体テスト
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpmセットアップ
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22.15'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 依存パッケージインストール
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: cd frontend && pnpm lint

      - name: 単体テスト実行
        run: cd frontend && pnpm test

  unit-test:
    name: 単体テスト
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 単体テスト実行
        run: ./backend/gradlew -p backend test

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/build/reports/tests/test/

  integration-test:
    name: 結合テスト
    needs: unit-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: web_gallery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: データベース初期化
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d web_gallery_test -c "CREATE SCHEMA IF NOT EXISTS common;"
          psql -h localhost -p 5433 -U postgres -d web_gallery_test -c "CREATE SCHEMA IF NOT EXISTS photo;"
          SQL_FILES=(
            "db/common/common.type.sql"
            "db/common/account.sql"
            "db/common/refresh_token.sql"
            "db/common/kbn_mst.sql"
            "db/common/location_mst.sql"
            "db/photo/photo.type.sql"
            "db/photo/photo_mst.sql"
            "db/photo/photo_tag_mst.sql"
            "db/photo/photo_favorite.sql"
          )
          for file in "${SQL_FILES[@]}"; do
            psql -h localhost -p 5433 -U postgres -d web_gallery_test -f "$file"
          done

      - name: 結合テスト実行
        run: ./backend/gradlew -p backend integrationTest

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/build/reports/tests/integrationTest/

  e2e-test:
    name: E2Eテスト
    needs: unit-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: web_gallery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: pnpmセットアップ
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22.15'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: フロントエンド依存パッケージインストール
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Playwrightブラウザインストール
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: データベース初期化
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d web_gallery -c "CREATE SCHEMA IF NOT EXISTS common;"
          psql -h localhost -p 5432 -U postgres -d web_gallery -c "CREATE SCHEMA IF NOT EXISTS photo;"
          SQL_FILES=(
            "db/common/common.type.sql"
            "db/common/account.sql"
            "db/common/refresh_token.sql"
            "db/common/kbn_mst.sql"
            "db/common/location_mst.sql"
            "db/photo/photo.type.sql"
            "db/photo/photo_mst.sql"
            "db/photo/photo_tag_mst.sql"
            "db/photo/photo_favorite.sql"
          )
          for file in "${SQL_FILES[@]}"; do
            psql -h localhost -p 5432 -U postgres -d web_gallery -f "$file"
          done

      - name: バックエンドをバックグラウンドで起動
        env:
          # application-local.yml は JWT_SECRET のデフォルト値を持たないため、CI用の値を明示する（本番用ではない）
          JWT_SECRET: e2e-only-secret-not-for-production-must-be-256-bits-long
        run: |
          SPRING_PROFILES_ACTIVE=local nohup ./backend/gradlew -p backend bootRun --no-daemon > backend-e2e.log 2>&1 &

      - name: バックエンドの起動を待機
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "バックエンドが起動しました"
              exit 0
            fi
            sleep 2
          done
          echo "バックエンドの起動がタイムアウトしました"
          cat backend-e2e.log
          exit 1

      - name: E2Eテスト実行
        run: cd frontend && pnpm exec playwright test

      - name: バックエンドログアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: backend-e2e.log

      - name: Playwrightレポートアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  e2e-prod-smoke:
    name: 本番CSPスモークテスト
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpmセットアップ
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22.15'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: フロントエンド依存パッケージインストール
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Playwrightブラウザインストール
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: 本番ビルドに対するCSPスモークテスト実行
        run: cd frontend && pnpm test:e2e:prod

      - name: Playwrightレポートアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-smoke
          path: frontend/playwright-report/
          retention-days: 7
