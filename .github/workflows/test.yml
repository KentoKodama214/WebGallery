name: テスト実行

on:
  pull_request:
    branches:
      - development
      - staging
      - master
  workflow_dispatch:

# 同一ブランチへ連続してpushした場合、古い実行をキャンセルして最新のコミットのみ検証する。
# ランナーの空き待ちが解消され、結果が返るまでの時間が短くなる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit-test:
    name: フロントエンド単体テスト
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: pnpmセットアップ
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Node.js セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22.15'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 依存パッケージインストール
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: cd frontend && pnpm lint

      - name: 単体テスト実行（カバレッジ計測）
        run: cd frontend && pnpm test --coverage

      - name: カバレッジ集計データアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage-summary
          path: frontend/coverage/coverage-summary.json

  gallery-api-unit-test:
    name: gallery-api単体テスト
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleセットアップ
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: gallery-api
          # デフォルトブランチ以外では読み取り専用になるため明示的に書き込みを許可する。
          # 同一PRへ追加pushした際に、変更のないモジュールのコンパイル結果（compileJava・
          # compileTestJava）やテストタスクの出力をビルドキャッシュから復元できる
          cache-read-only: false

      - name: 単体テスト実行
        run: ./gallery-api/gradlew -p gallery-api unitTest

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-api-unit-test-results
          path: gallery-api/build/reports/tests/unitTest/

      - name: カバレッジ実行データアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-unit
          path: gallery-api/build/jacoco/unitTest.exec

  # portfolio-api（Go。公開ページ向けのポートフォリオ表示API）の静的解析・単体テスト。
  # DBを必要としないため、gallery-apiの単体テストと同様にサービスコンテナを起動しない
  portfolio-api-unit-test:
    name: portfolio-api単体テスト
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio-api

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: Go セットアップ
        uses: actions/setup-go@v7
        with:
          go-version-file: portfolio-api/go.mod
          cache-dependency-path: portfolio-api/go.sum

      - name: フォーマットチェック（gofmt）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      - name: 静的解析（go vet）
        run: go vet -tags integration ./...

      # スキーマ（graph/schema.graphqls）を変更したのに go generate を忘れた場合を検出する
      - name: GraphQL生成コードの差分チェック
        run: |
          go generate ./...
          git diff --exit-code -- graph/

      # -coverpkg=./... で、テストを持たないパッケージ（cmd/server等）も含めたモジュール全体を計測対象にする
      - name: 単体テスト実行（カバレッジ計測）
        run: go test -coverpkg=./... -coverprofile=unit.out ./...

      - name: カバレッジプロファイルアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-unit
          path: portfolio-api/unit.out

  # portfolio-apiの結合テスト。本番と同じ読み取り専用ロール（portfolio_reader）で接続するため、
  # db/photo/portfolio_reader.sql までを流してDBを初期化する
  portfolio-api-integration-test:
    name: portfolio-api結合テスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_gallery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: portfolio-api

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: Go セットアップ
        uses: actions/setup-go@v7
        with:
          go-version-file: portfolio-api/go.mod
          cache-dependency-path: portfolio-api/go.sum

      - name: データベース初期化
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d web_gallery_test -c "CREATE SCHEMA IF NOT EXISTS common;"
          psql -h localhost -p 5433 -U postgres -d web_gallery_test -c "CREATE SCHEMA IF NOT EXISTS photo;"
          SQL_FILES=(
            "db/common/common.type.sql"
            "db/common/account.sql"
            "db/common/location_mst.sql"
            "db/photo/photo.type.sql"
            "db/photo/photo_mst.sql"
            "db/photo/portfolio_mst.sql"
            "db/photo/portfolio_photo.sql"
            "db/photo/portfolio_tag_mst.sql"
            "db/photo/portfolio_reader.sql"
          )
          for file in "${SQL_FILES[@]}"; do
            psql -h localhost -p 5433 -U postgres -d web_gallery_test -v ON_ERROR_STOP=1 -f "$file"
          done

      # -tags integration を付けると全パッケージの単体テストも実行対象になり、portfolio-api単体テストと
      # 重複してカバレッジの区別もつかなくなるため、結合テスト（//go:build integration）を含むパッケージに限定する。
      # -coverpkg=./... で、テスト対象パッケージ以外を経由して実行されたコードも計測する
      - name: 結合テスト実行（カバレッジ計測）
        run: |
          packages=$(find . -name '*_test.go' -exec grep -l '^//go:build integration' {} + | xargs -n1 dirname | sort -u)
          go test -tags integration -coverpkg=./... -coverprofile=integration.out $packages

      - name: カバレッジプロファイルアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-integration
          path: portfolio-api/integration.out

  # 単体テストへのneedsは指定しない。単体テストと結合テスト・E2Eテストの間に成果物の
  # 受け渡しはなく、直列化すると単体テストの所要時間がそのままクリティカルパスに積まれるため、
  # 最初から並列で起動する
  gallery-api-integration-test:
    name: gallery-api結合テスト
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_gallery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleセットアップ
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: gallery-api
          cache-read-only: false

      - name: データベース初期化
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d web_gallery_test -c "CREATE SCHEMA IF NOT EXISTS common;"
          psql -h localhost -p 5433 -U postgres -d web_gallery_test -c "CREATE SCHEMA IF NOT EXISTS photo;"
          SQL_FILES=(
            "db/common/common.type.sql"
            "db/common/account.sql"
            "db/common/inquiry_mst.sql"
            "db/common/inquiry_reply_mst.sql"
            "db/common/account_authority.sql"
            "db/common/refresh_token.sql"
            "db/common/login_history.sql"
            "db/common/kbn_mst.sql"
            "db/common/location_mst.sql"
            "db/photo/photo.type.sql"
            "db/photo/photo_mst.sql"
            "db/photo/photo_tag_mst.sql"
            "db/photo/photo_favorite.sql"
            "db/photo/photo_list_filter_log.sql"
            "db/photo/photo_view_log.sql"
            "db/photo/portfolio_mst.sql"
            "db/photo/portfolio_photo.sql"
            "db/photo/portfolio_tag_mst.sql"
            "db/photo/portfolio_reader.sql"
          )
          for file in "${SQL_FILES[@]}"; do
            psql -h localhost -p 5433 -U postgres -d web_gallery_test -f "$file"
          done

      # FileRepositoryImplIntegrationTest（Repository層）が実接続する画像ストレージ（S3互換）。
      # GitHub Actionsのservicesはコンテナ起動時のcommand引数を指定できず、
      # minio/minioイメージはCMD（server /data）なしでは起動しないため、docker runで直接起動する。
      # minio/minioはDocker Hub、quay.io/minio/minioも2026-09-24付けで匿名pullをロックダウンしたため、
      # 匿名pull可能でmcクライアントも同一イメージに同梱するChainguard版イメージを使用する
      # （docker-compose.ymlと同様）
      - name: MinIO起動
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              break
            fi
            sleep 2
          done

      - name: MinIOバケット作成
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            --entrypoint mc \
            cgr.dev/chainguard/minio:latest mb --ignore-existing local/test-bucket

      - name: 結合テスト実行
        run: ./gallery-api/gradlew -p gallery-api integrationTest

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-api-integration-test-results
          path: gallery-api/build/reports/tests/integrationTest/

      - name: カバレッジ実行データアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-integration
          path: gallery-api/build/jacoco/integrationTest.exec

  # gallery-api-integration-testと同様にneedsは指定せず、最初から並列で起動する。
  # ブラウザ別に2つのジョブへ分割し、webkit（Desktop Safari・iPhone 13）のダウンロードと
  # スモークテストの実行をchromium側のクリティカルパスから外す
  e2e-test:
    name: E2Eテスト（${{ matrix.name }}）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # playwright.config.tsの全specを対象とする本体
          - name: chromium
            browsers: chromium
            project_args: --project=chromium
          # CROSS_BROWSER_SPECS（login・photo_list）のみを対象とするスモーク。
          # mobile-smokeのiPhone 13もWebKitエンジンのため、インストールはwebkitのみでよい
          - name: cross-browser
            browsers: webkit
            project_args: --project=webkit-smoke --project=mobile-smoke

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_gallery
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleセットアップ
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: gallery-api
          cache-read-only: false

      - name: データベース初期化
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d web_gallery -c "CREATE SCHEMA IF NOT EXISTS common;"
          psql -h localhost -p 5432 -U postgres -d web_gallery -c "CREATE SCHEMA IF NOT EXISTS photo;"
          SQL_FILES=(
            "db/common/common.type.sql"
            "db/common/account.sql"
            "db/common/inquiry_mst.sql"
            "db/common/inquiry_reply_mst.sql"
            "db/common/account_authority.sql"
            "db/common/refresh_token.sql"
            "db/common/login_history.sql"
            "db/common/kbn_mst.sql"
            "db/common/location_mst.sql"
            "db/photo/photo.type.sql"
            "db/photo/photo_mst.sql"
            "db/photo/photo_tag_mst.sql"
            "db/photo/photo_favorite.sql"
            "db/photo/photo_list_filter_log.sql"
            "db/photo/photo_view_log.sql"
            "db/photo/portfolio_mst.sql"
            "db/photo/portfolio_photo.sql"
            "db/photo/portfolio_tag_mst.sql"
            "db/photo/portfolio_reader.sql"
          )
          for file in "${SQL_FILES[@]}"; do
            psql -h localhost -p 5432 -U postgres -d web_gallery -f "$file"
          done

      # バックエンドの起動（Gradleの起動・コンパイル・Spring Bootの初期化）には1分近くかかるため、
      # データベースの初期化直後にバックグラウンドで起動しておき、MinIOの起動とフロントエンドの
      # セットアップ（pnpm install・Playwrightブラウザのインストール）を並行して進める。
      # 起動完了の待機は「バックエンドの起動を待機」ステップで、E2Eテストの直前に行う。
      # S3クライアント（S3ClientConfig）はBean生成時にMinIOへ接続しないため、
      # MinIOの起動を待たずにバックエンドを起動して問題ない
      - name: バックエンドをバックグラウンドで起動
        env:
          # application-local.yml は JWT_SECRET のデフォルト値を持たないため、CI用の値を明示する（本番用ではない）
          JWT_SECRET: e2e-only-secret-not-for-production-must-be-256-bits-long
          # E2Eテストは全ワーカーが同一IP（::1）から多数のアカウント登録・ログインを行うため、
          # 本番向けのレート制限が誤検知する（scripts/e2e.shのローカル実行と同様に無効化する）
          RATE_LIMIT_ENABLED: "false"
        run: |
          SPRING_PROFILES_ACTIVE=local nohup ./gallery-api/gradlew -p gallery-api bootRun --no-daemon > backend-e2e.log 2>&1 &

      # 写真アップロードのE2Eシナリオが実接続する画像ストレージ（S3互換）。
      # GitHub Actionsのservicesはコンテナ起動時のcommand引数を指定できず、
      # minio/minioイメージはCMD（server /data）なしでは起動しないため、docker runで直接起動する。
      # minio/minioはDocker Hub、quay.io/minio/minioも2026-09-24付けで匿名pullをロックダウンしたため、
      # 匿名pull可能でmcクライアントも同一イメージに同梱するChainguard版イメージを使用する
      # （docker-compose.ymlと同様）
      - name: MinIO起動
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              break
            fi
            sleep 2
          done

      - name: MinIOバケット作成
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            --entrypoint mc \
            cgr.dev/chainguard/minio:latest mb --ignore-existing local/web-gallery-local

      - name: pnpmセットアップ
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Node.js セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22.15'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: フロントエンド依存パッケージインストール
        run: cd frontend && pnpm install --frozen-lockfile

      # ブラウザのバイナリをキャッシュしてダウンロードを省略する。@playwright/testの
      # バージョンが変わると必要なブラウザのリビジョンも変わるため、キーにはpnpm-lock.yamlの
      # ハッシュを含める（部分一致で古いリビジョンを復元しないよう restore-keys は指定しない）
      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browsers }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # --with-depsはブラウザの実行に必要なOSライブラリ（apt）も導入する。
      # キャッシュヒット時はブラウザのダウンロードが省略され、apt部分のみが実行される
      - name: Playwrightブラウザインストール
        run: cd frontend && pnpm exec playwright install --with-deps ${{ matrix.browsers }}

      - name: Go セットアップ
        uses: actions/setup-go@v7
        with:
          go-version-file: portfolio-api/go.mod
          cache-dependency-path: portfolio-api/go.sum

      # 公開ページ（/portfolio/**）が Next.js のサーバーから呼び出す、ポートフォリオ表示API
      - name: portfolio-apiをバックグラウンドで起動
        env:
          PORTFOLIO_API_ENV: local
        run: |
          cd portfolio-api && go build -o ../portfolio-api-e2e ./cmd/server && cd ..
          nohup ./portfolio-api-e2e > portfolio-api-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/healthz > /dev/null; then
              echo "portfolio-apiが起動しました"
              exit 0
            fi
            sleep 1
          done
          echo "portfolio-apiの起動がタイムアウトしました"
          cat portfolio-api-e2e.log
          exit 1

      - name: バックエンドの起動を待機
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "バックエンドが起動しました"
              exit 0
            fi
            sleep 2
          done
          echo "バックエンドの起動がタイムアウトしました"
          cat backend-e2e.log
          exit 1

      - name: E2Eテスト実行
        run: cd frontend && pnpm exec playwright test ${{ matrix.project_args }}

      - name: バックエンドログアップロード
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-backend-log-${{ matrix.name }}
          path: backend-e2e.log

      - name: portfolio-apiログアップロード
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-portfolio-api-log-${{ matrix.name }}
          path: portfolio-api-e2e.log

      - name: Playwrightレポートアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: frontend/playwright-report/
          retention-days: 7

  e2e-prod-smoke:
    name: 本番CSPスモークテスト
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: pnpmセットアップ
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Node.js セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22.15'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: フロントエンド依存パッケージインストール
        run: cd frontend && pnpm install --frozen-lockfile

      # e2e-testのchromiumジョブとキーを共有し、どちらかが作成したキャッシュを再利用する
      - name: Playwrightブラウザキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Playwrightブラウザインストール
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: 本番ビルド
        run: cd frontend && pnpm build

      - name: 本番ビルドに対するCSPスモークテスト実行
        run: cd frontend && pnpm test:e2e:prod

      - name: Playwrightレポートアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod-smoke
          path: frontend/playwright-report/
          retention-days: 7

  coverage-report:
    name: カバレッジレポート
    needs:
      - frontend-unit-test
      - gallery-api-unit-test
      - gallery-api-integration-test
      - portfolio-api-unit-test
      - portfolio-api-integration-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: JDK 21 セットアップ
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradleセットアップ
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: gallery-api
          cache-read-only: false

      # portfolio-apiの関数カバレッジの算出（go tool cover -func）に使用する
      - name: Go セットアップ
        uses: actions/setup-go@v7
        with:
          go-version-file: portfolio-api/go.mod
          cache-dependency-path: portfolio-api/go.sum

      - name: カバレッジ実行データダウンロード
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-exec-*
          path: gallery-api/build/jacoco
          merge-multiple: true

      - name: portfolio-apiカバレッジプロファイルダウンロード
        uses: actions/download-artifact@v8
        with:
          pattern: go-coverage-*
          path: portfolio-api/coverage
          merge-multiple: true

      - name: フロントエンドカバレッジ集計データダウンロード
        uses: actions/download-artifact@v8
        with:
          name: jest-coverage-summary
          path: frontend/coverage

      - name: gallery-apiカバレッジレポート生成（単体 / 結合 / 集約）
        run: ./gallery-api/gradlew -p gallery-api jacocoUnitReport jacocoIntegrationReport jacocoAggregateReport

      - name: カバレッジ集計表を生成
        run: |
          python3 .github/scripts/jacoco_coverage_table.py \
            "単体＋結合=gallery-api/build/reports/jacoco/jacocoAggregateReport/jacocoAggregateReport.xml" \
            "単体テスト=gallery-api/build/reports/jacoco/jacocoUnitReport/jacocoUnitReport.xml" \
            "結合テスト=gallery-api/build/reports/jacoco/jacocoIntegrationReport/jacocoIntegrationReport.xml" \
            > coverage-table.md
          echo >> coverage-table.md
          python3 .github/scripts/go_coverage_table.py \
            --module-dir portfolio-api \
            --exclude graph/generated.go \
            --exclude graph/model/models_gen.go \
            "単体＋結合=portfolio-api/coverage/unit.out,portfolio-api/coverage/integration.out" \
            "単体テスト=portfolio-api/coverage/unit.out" \
            "結合テスト=portfolio-api/coverage/integration.out" \
            >> coverage-table.md
          echo >> coverage-table.md
          python3 .github/scripts/jest_coverage_table.py \
            frontend/coverage/coverage-summary.json \
            >> coverage-table.md
          cat coverage-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: PRにカバレッジを単一コメントで投稿
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- jacoco-coverage-report -->"
        run: |
          { echo "$MARKER"; cat coverage-table.md; } > coverage-comment.md
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.body | startswith(\"${MARKER}\"))) | (last | .id) // empty" | tail -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@coverage-comment.md
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@coverage-comment.md
          fi
