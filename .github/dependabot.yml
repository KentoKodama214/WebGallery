version: 2
updates:
  # backend（Gradle）
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # frontend（pnpm）
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7系はプログラマティックAPIを提供しておらず、
      # typescript-eslintが未対応のためLintが失敗する（TS 7.1での対応を待つ）
      # https://github.com/typescript-eslint/typescript-eslint/issues/12518
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # ESLint 10系はeslint-config-next経由のeslint-plugin-react@7.37.5と非互換
      # （context.getFilename()廃止によりLintがエラー、2026-09-14時点で未対応）
      # https://github.com/jsx-eslint/eslint-plugin-react
      - dependency-name: "eslint"
        versions: [">=10.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
