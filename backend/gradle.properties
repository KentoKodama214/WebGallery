# Gradleビルドキャッシュを有効化する。
# タスクの入力（ソース・依存関係・設定）が前回と同一であれば、compileJava・compileTestJava・
# unitTest・integrationTest等の出力をローカルビルドキャッシュ（~/.gradle/caches/build-cache-1）
# から復元し、再実行を省略する。CI（.github/workflows/test.yml）では複数ジョブが同じ
# コンパイル処理を重複実行しているため、キャッシュヒット時の短縮効果が大きい
org.gradle.caching=true

# 依存関係のないタスクを並列実行する
org.gradle.parallel=true
