plugins {
	id 'java'
	id 'war'
	id 'checkstyle'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.10.2'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.dddjava.jig-gradle-plugin' version '2026.8.1'
	id 'org.owasp.dependencycheck' version '13.0.0'
}

checkstyle {
	toolVersion = '10.21.4'
	configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		googleJavaFormat()
		removeUnusedImports()
		importOrder()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

jacoco {
	toolVersion = '0.8.13'
}

dependencyCheck {
	// CVSSスコア7.0以上（High以上）の既知脆弱性を含む依存ライブラリが見つかった場合にビルドを失敗させる
	failBuildOnCVSS = 7
	formats = ['HTML', 'JUNIT']
	data {
		// CIでキャッシュ可能な固定パスに脆弱性データベースを保存する（毎回フル同期させないため）
		directory = "${System.getProperty('user.home')}/.gradle/dependency-check-data"
	}
}

// NVD API v2.0は未認証アクセスを事実上受け付けず、APIキー未設定だと
// dependencyCheckAnalyzeがデータ同期時に例外で失敗する（速度低下ではなく必須要件）。
// https://nvd.nist.gov/developers/request-an-api-key で取得し、環境変数 NVD_API_KEY で渡すこと。
// nvd.apiKeyへ空文字・nullを設定すると「キー指定あり」の認証モードに入り
// 空キーとして検証エラーになるため、値が存在する場合のみ設定する
String nvdApiKey = System.getenv('NVD_API_KEY')
if (nvdApiKey) {
	dependencyCheck.nvd.apiKey = nvdApiKey
}

checkstyleTest.enabled = false

group = 'com.official'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.1'
		mavenBom 'software.amazon.awssdk:bom:2.54.18'
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot / Spring Security / Tomcat / JUnit / Mockito / PostgreSQL ドライバのバージョンは
	// org.springframework.boot プラグイン（4.1.1）＋ io.spring.dependency-management が提供する
	// BOM に一元管理させ、ここでは明示しない（バージョンの二重管理・不整合を防ぐ）。
	// BOM 管理外のサードパーティ依存（jjwt / modelmapper / springdoc / mybatis-spring-boot-starter /
	// archunit / lombok / geoip2）のみバージョンを明示する。
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.modelmapper:modelmapper:3.2.6'
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.1.1'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	// IPアドレスから国・地域を解決するGeoLite2（MaxMind）用リーダー
	implementation 'com.maxmind.geoip2:geoip2:5.2.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	compileOnly 'org.projectlombok:lombok:1.18.48'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'
	providedRuntime 'org.apache.tomcat.embed:tomcat-embed-core'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.modulith:spring-modulith-docs'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
}

tasks.named('test') {
	enabled = false
}

tasks.register('unitTest', Test) {
	description = '単体テストのみを実行する'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	exclude '**/*IntegrationTest*'
	exclude '**/mapper/*Test*'
	exclude '**/ModulithDocumentationTest*'
}

tasks.named('check') {
	dependsOn tasks.named('unitTest')
	dependsOn tasks.named('spotlessCheck')
}

tasks.register('integrationTest', Test) {
	description = '統合テストのみを実行する'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/*IntegrationTest*'
	include '**/mapper/*Test*'
}

tasks.register('allTest', Test) {
	description = '単体テストと統合テストをすべて実行する'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	exclude '**/ModulithDocumentationTest*'
}

tasks.register('generateModulithDocs', Test) {
	description = 'Spring Modulithのドキュメントを生成する'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/ModulithDocumentationTest*'
}

// build/jacoco/ 配下のカバレッジ実行データ（*.exec）からカバレッジレポート（XML/HTML）を
// 生成するタスクを登録する。CIでは各テストジョブが生成した .exec を build/jacoco/ に集めてから
// これらのタスクを実行するため、テスト自体の実行は強制しない（同一ビルド内で同時指定された
// 場合のみ mustRunAfter で順序を保証する）。存在しない .exec は空として扱う。
def registerJacocoReport = { String name, String desc, String execPattern ->
	tasks.register(name, JacocoReport) {
		description = desc
		group = 'verification'
		dependsOn 'classes'
		mustRunAfter tasks.withType(Test)

		executionData.setFrom(fileTree(layout.buildDirectory).include(execPattern))
		sourceDirectories.setFrom(files(sourceSets.main.java.srcDirs))
		classDirectories.setFrom(files(sourceSets.main.output))

		reports {
			xml.required = true
			html.required = true
		}
	}
}

registerJacocoReport('jacocoUnitReport', '単体テストのみのカバレッジレポートを生成する', 'jacoco/unitTest.exec')
registerJacocoReport('jacocoIntegrationReport', '結合テストのみのカバレッジレポートを生成する', 'jacoco/integrationTest.exec')
registerJacocoReport('jacocoAggregateReport', '単体テストと結合テストのカバレッジを集約してレポートを生成する', 'jacoco/*.exec')

jig {
	modelPattern = 'com\\.web\\.gallery\\..*'
}

tasks.named('jigReports') {
	dependsOn 'classes'
}
