spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/web_gallery}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

logging:
  level:
    ROOT: DEBUG

app:
  photo:
    miniUserUpperLimit: ${MINI_USER_UPPER_LIMIT:10}
    normalUserUpperLimit: ${NORMAL_USER_UPPER_LIMIT:1000}
    outputPath: ${OUTPUT_PATH:https://localhost:8080/image/}
  jwt:
    # デフォルト値は設けない。既知のシークレットが混入するとJWT偽造が可能になるため、
    # ローカル実行でも環境変数 JWT_SECRET（256bit以上）の設定を必須とする
    secret: ${JWT_SECRET}
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
