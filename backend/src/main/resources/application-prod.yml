spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # リードレプリカ（AWS RDS）を使う場合、このファイルにキーを追加せず、インフラ側で環境変数
    # APP_DATASOURCE_REPLICA_URL のみを設定すること。${APP_DATASOURCE_REPLICA_URL:} のように
    # 空文字デフォルトをYAMLへ書くと、未設定環境でも app.datasource.replica.url キー自体は存在してしまい、
    # 意図せずリードレプリカ用DataSourceが生成されてしまう（詳細: doc/architecture/datasource.md）

logging:
  level:
    ROOT: INFO

app:
  photo:
    miniUserUpperLimit: ${MINI_USER_UPPER_LIMIT}
    normalUserUpperLimit: ${NORMAL_USER_UPPER_LIMIT}
  s3:
    endpoint: ${APP_S3_ENDPOINT:}
    bucket: ${APP_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-1}
    access-key: ${APP_S3_ACCESS_KEY}
    secret-key: ${APP_S3_SECRET_KEY}
    path-style-access: ${APP_S3_PATH_STYLE_ACCESS:false}
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN}
