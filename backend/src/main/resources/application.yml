spring:
  application:
    name: WebGallery
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  tomcat:
    remoteip:
      remote-ip-header: "x-forwarded-for"
      protocol-header: "x-forwarded-proto"

springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar

mybatis:
  type-handlers-package: com.web.gallery.type_handler

management:
  add-application-context-header: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36}.%M:%L - %msg%n"

app:
  account:
    accountCountPerPage: 20
  photo:
    photoCountPerPage: 20
    maxFileSizeMb: 5
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpirationMinutes: 15
    refreshTokenExpirationDays: 7

auth:
  login:
    failCount: 3
    lockDurationMinutes: 30
