spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/web_gallery_test
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Tokyo

auth:
  login:
    failCount: 3
    lockDurationMinutes: 30
  reauth:
    # 再認証スロットルはプロセスローカルのため統合テスト間で状態が持ち越される。
    # テストでは無効化し、スロットル単体の挙動は ReauthenticationThrottleTest で検証する
    max-failures: 0
    lockout-minutes: 15

app:
  account:
    accountCountPerPage: 5
  photo:
    photoCountPerPage: 5
    maxFileSizeMb: 5
    miniUserUpperLimit: 10
    normalUserUpperLimit: 20
  s3:
    # 統合テストでは FileRepository をモックするため S3 へは接続しない。Bean生成用のダミー値
    endpoint: http://localhost:9000
    bucket: test-bucket
    region: ap-northeast-1
    access-key: test
    secret-key: test
    path-style-access: true
    presign-expiry-seconds: 900
    public-base-url: ""
  jwt:
    secret: test-secret-must-be-at-least-256-bits-long-for-hs256-algorithm
    # テストでは盗用検知の猶予期間を無効化し、ローテーション済みトークンの再利用を即座に盗用とみなす
    refreshTokenReuseGraceSeconds: 0
  auth:
    # テストではアカウント状態の変化を即時反映させるためPrincipalキャッシュを無効化する
    principal-cache-ttl-millis: 0
  cors:
    allowed-origins:
      - http://localhost:3000